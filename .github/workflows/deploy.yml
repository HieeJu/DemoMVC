name: Deploy ASP.NET Core MVC to MonsterASP.net

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x' # Thay bằng phiên bản .NET bạn đang dùng (ví dụ: 8.0.x hoặc 9.0.x)

      - name: Restore dependencies
        run: dotnet restore DemoMVC.csproj

      - name: Build project
        run: dotnet build DemoMVC.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish DemoMVC.csproj --configuration Release -o ./publish

      # Đưa dữ liệu lên MonsterASP.net qua FTP (ví dụ phổ biến)
      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/